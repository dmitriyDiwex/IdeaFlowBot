services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ideaflow_editorial}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ideaflow_editorial}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  collector-bot:
    image: ideaflowbot-app:local
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: python main.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      editorial-migrate:
        condition: service_completed_successfully

  editorial-migrate:
    image: ideaflowbot-app:local
    restart: "no"
    env_file:
      - .env
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  editorial-api:
    image: ideaflowbot-app:local
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn src.editorial.api.app:app --host 0.0.0.0 --port 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      editorial-migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8080"

  editorial-mcp:
    image: ideaflowbot-app:local
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn src.editorial.mcp.server:app --host 0.0.0.0 --port 8082
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      editorial-migrate:
        condition: service_completed_successfully
    ports:
      # Bind locally by default. Put HTTPS/VPN in front before remote access.
      - "${EDITORIAL_MCP_BIND_ADDRESS:-127.0.0.1}:${EDITORIAL_MCP_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; raise SystemExit(0 if requests.get('http://127.0.0.1:8082/health', timeout=5).ok else 1)"]
      interval: 15s
      timeout: 7s
      retries: 5

  editorial-importer:
    image: ideaflowbot-app:local
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "while true; do python -m src.editorial.cli import-legacy; sleep 60; done"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      editorial-migrate:
        condition: service_completed_successfully

  editorial-auto-slots:
    image: ideaflowbot-app:local
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "while true; do python -m src.editorial.cli auto-slots; sleep 60; done"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      editorial-migrate:
        condition: service_completed_successfully

  editorial-scheduler:
    image: ideaflowbot-app:local
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "while true; do python -m src.editorial.cli schedule; sleep 300; done"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      editorial-migrate:
        condition: service_completed_successfully

  editorial-profile-sync:
    image: ideaflowbot-app:local
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "while true; do python -m src.editorial.cli sync-channel-profiles; sleep 3600; done"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      editorial-migrate:
        condition: service_completed_successfully

  editorial-publisher:
    image: ideaflowbot-app:local
    restart: unless-stopped
    env_file:
      - .env
    command: sh -c "while true; do python -m src.editorial.cli publish; sleep 30; done"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      editorial-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
